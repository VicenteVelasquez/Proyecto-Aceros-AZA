{% extends "base.html" %}
{% block title %}Recuperar Contraseña - AZA{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 aza-card p-4 shadow-sm">
      <h3 class="fw-bold text-dark mb-3 text-center"><i class="fa-solid fa-key text-success me-2"></i>Recuperar Acceso</h3>
      <p class="text-muted small text-center mb-4">Ingrese su correo electrónico corporativo registrado para recibir el enlace de restablecimiento.</p>
      
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Correo Electrónico</label>
          <input type="email" name="email" class="form-control" placeholder="operador@aza.cl" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Enviar Enlace de Recuperación</button>
      </form>
      
      <div class="text-center mt-3">
        <a href="{{ url_for('login_view') }}" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i>Volver al Inicio de Sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
