{% extends "base.html" %}
{% block title %}Nueva Contraseña - AZA{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 aza-card p-4 shadow-sm">
      <h3 class="fw-bold text-dark mb-3 text-center"><i class="fa-solid fa-lock-open text-success me-2"></i>Restablecer Contraseña</h3>
      <p class="text-muted small text-center mb-4">Ingrese su nueva contraseña de acceso seguro para el sistema de planta.</p>
      
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nueva Contraseña (Mín. 8 caracteres)</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Confirmar Nueva Contraseña</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Actualizar Contraseña</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
